version: '3'

tasks:
  # Quality Gates
  check:
    desc: Run all quality gates (format, lint, test)
    cmds:
      - cargo fmt --all -- --check
      - cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - cargo test --all-targets --all-features

  fmt:
    desc: Format code including fuzz targets
    cmds:
      - cargo fmt --all
      - cargo fmt --manifest-path fuzz/Cargo.toml

  lint:
    desc: Run clippy on workspace and fuzz targets
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  test:
    desc: Run all tests
    cmds:
      - cargo test --all-targets --all-features --verbose

  test:unit:
    desc: Run unit tests only
    cmds:
      - cargo test --lib

  test:integration:
    desc: Run integration tests only
    cmds:
      - cargo test --test '*'

  test:doc:
    desc: Run documentation tests
    cmds:
      - cargo test --doc

  # Unsafe Code & Miri
  miri:
    desc: Run Miri to detect undefined behavior (requires nightly)
    cmds:
      - cargo miri test --all-targets --all-features

  miri:strict:
    desc: Run Miri with strict provenance checking (experimental)
    cmds:
      - cargo miri test --all-targets --all-features
    env:
      MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"

  # Coverage & Profiling
  cov:
    desc: Generate HTML coverage report
    cmds:
      - cargo llvm-cov --html --open
      - echo "Coverage report opened in browser"

  # Building & Running
  build:
    desc: Build debug binary
    cmds:
      - cargo build

  build:release:
    desc: Build optimized release binary
    cmds:
      - cargo build --release

  run:
    desc: Run the CLI
    cmds:
      - cargo run --

  # Benchmarking
  bench:
    desc: Run benchmarks
    cmds:
      - cargo bench --all-targets --all-features

  # Maintenance & Dependencies
  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  update:
    desc: Update dependencies interactively
    cmds:
      - cargo update --aggressive

  outdated:
    desc: Check for outdated dependencies
    cmds:
      - cargo outdated

  audit:
    desc: Audit dependencies for vulnerabilities
    cmds:
      - cargo audit

  machete:
    desc: Find unused dependencies (requires cargo-machete)
    cmds:
      - cargo machete

  expand:
    desc: Expand macros for debugging (requires cargo-expand)
    cmds:
      - cargo expand

  udeps:
    desc: Detect unused dependencies (requires cargo-udeps)
    cmds:
      - cargo udeps -q

  geiger:
    desc: Scan crate for unsafe usage (requires cargo-geiger)
    cmds:
      - cargo geiger --output-format text

  fuzz:init:
    desc: Initialize fuzz scaffolding (requires cargo-fuzz)
    cmds:
      - bash -lc "cargo install cargo-fuzz --locked || true"
      - echo "Run 'cargo fuzz add <target>' inside a nix dev shell to add targets"

  fuzz:run:
    desc: Run a fuzz target (requires cargo-fuzz)
    cmds:
      - bash -lc "cargo fuzz run basic -- -runs=100"

  sbom:
    desc: Generate SBOM using Syft (requires syft)
    cmds:
      - bash -lc "syft . -o json > sbom.json && echo 'SBOM written to sbom.json'"

  release:
    desc: Create a release using cargo-release
    cmds:
      - bash -lc "cargo install cargo-release --locked || true"
      - bash -lc "cargo release patch --no-push"

  # Development Tools
  watch:
    desc: Watch for file changes and run tests (requires cargo-watch)
    cmds:
      - cargo watch -x test

  watch:check:
    desc: Watch for file changes and run checks (requires cargo-watch)
    cmds:
      - cargo watch -x check

  bacon:
    desc: Run bacon for background code checking (requires bacon)
    cmds:
      - bacon
