version: '3'

tasks:
  check:
    desc: Run all quality gates
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test

  cov:
    desc: Generate HTML coverage report
    cmds:
      - cargo llvm-cov --html
      - xdg-open target/llvm-cov/html/index.html