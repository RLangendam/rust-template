[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
vulnerability = "deny"
unmaintained = "warn"

[licenses]
unlicensed = "deny"
allow = ["MIT", "Apache-2.0", "BSD-3-Clause"]
# Specifically block GPL or copyleft if your project is commercial
deny = ["GPL-3.0"]

[bans]
multiple-versions = "warn" # Warn if two versions of the same crate are in the tree