name: CI Full Validation

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  full-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy, rustfmt"

      - name: Install Python & pre-commit
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install cargo tools
        run: |
          cargo install --locked cargo-deny || true
          cargo install --locked cargo-udeps || true
          cargo install --locked cargo-geiger || true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (strict)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --verbose

      - name: Run cargo-deny advisories
        run: cargo deny check advisories

      - name: Run cargo udeps (unused deps)
        run: cargo udeps -q || true

      - name: Run cargo geiger (unsafe usage)
        run: cargo geiger --output-format text || true

      - name: Run pre-commit hooks
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files || true
